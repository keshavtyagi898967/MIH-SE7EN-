<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="index.css">
<body>

    <div class="sidebar"> 

      <h2>📊 DataPulse</h2>

      <button >🏠 Dashboard </button>
      <button onclick="window.location.href='uploaddata.html'">👥 upload data</button>
      <button >👥 data cleaning</button>
      <button >📅 data explorer</button>
      <button >⚖️ Comparison</button>
      <button>📊 Visualization </button>

      <div class="bottom">
        <button>⚙️ Settings</button>
        <button>❓ Help</button>
     </div>
    </div>

     <header>
        <h1>Football analysis</h1>
        <p>Analyse players, Teams and mathes</p>
        <button id="signup_btn">Sign up</button>
        <button id="login_btn"> Login </button>
    </header>

    <div class="login-box">
        <h2 id="login-box-logo">Login</h2>

        <input type="text" id="userId" placeholder="Enter ID">

        <input type="password" id="password" placeholder="Enter Password">

        <button id="login-submitBtn">Login</button>

        <p id="error"></p>
    </div>

    <div class="signup-box">
        <h2 id="signup-box-logo">Signup</h2>

        <input type="text" id="userId" placeholder="Enter ID">

        <input type="password" id="password" placeholder="Enter Password">

        <button id="signup-submitBtn">Signup</button>

        <p id="error"></p>
    </div>
     


    <div class="cards">
        <div class="card1">
            <img id="card1-img" src="card1.jpg" alt="">
            <article id="card1-text"> Total Players Tracked </article>
            <article id="card1-teams"><h2>48</h2></article>
        </div>

        <div class="card2">
            <img id="card1-img" src="card1.jpg" alt="">
            <article id="card2-text"> Total Teams </article>
            <article id="card2-teams"><h2>8</h2></article>
        
        </div>

        <div class="card3">
            <img id="card1-img" src="card1.jpg" alt="">
            <article id="card3-text"> Match </article>
            <article id="card3-teams"><h2>24</h2></article>
        </div>
    </div>
   
    <script src="app.js"></script>
</body>
</html>
